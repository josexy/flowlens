name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest }
          - { os: macos-15-intel }
          - { os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # Keep verification caches separate from release build caches.
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
            .github/workflows/release.yml

      - name: Verify Go module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l main.go internal)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check UI lifecycle
        run: go tool mygo vet .

      - name: Check message catalogs
        run: go tool mygo i18n check

      - name: Run Go tests
        run: go test ./...

      - name: Run AppKit main-loop fixture
        if: runner.os == 'macOS'
        env:
          FLOWLENS_APPKIT_TEST: "1"
        run: go test ./internal/pkg/process_attribution -run TestDarwinAppKit -count=1 -timeout=2m

  compile:
    name: Compile desktop executables
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./internal/cmd/buildcheck

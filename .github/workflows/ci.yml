name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TASK_VERSION: v3.50.0

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task and golangci-lint
        run: |
          go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$(cat .golangci-lint-version)"

      - name: Verify Go module metadata
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run verification
        run: task verify

  cross-compile:
    name: Cross-compile Windows and Linux
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every Windows and Linux target
        run: go tool mygo build -platform windows/amd64,linux/amd64,linux/arm64 -skip-installer -o "${RUNNER_TEMP}/out"

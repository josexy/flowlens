name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          # Keep verification caches separate from release build caches.
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
            .github/workflows/release.yml

      - name: Verify Go module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l main.go internal)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check UI lifecycle
        run: go tool mygo vet .

      - name: Check message catalogs
        run: go tool mygo i18n check

      - name: Run Go tests
        run: go test ./...

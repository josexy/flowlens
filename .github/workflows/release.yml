name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version for manual runs, for example 1.2.3 or v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          raw_version="${RAW_VERSION:-$GITHUB_REF_NAME}"
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must look like 1.2.3 or v1.2.3, got: ${raw_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! jq -e --arg version "$VERSION" '.version == $version' mygo.json > /dev/null; then
            echo "mygo.json version must match the release version ${VERSION}." >&2
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          cat > "${RUNNER_TEMP}/release-body.md" <<BODY
          ## Download Guide

          | Platform | Asset |
          | --- | --- |
          | Windows x64 | \`flowlens-setup-*-amd64.exe\` (installer) |
          | Windows ARM64 | \`flowlens-setup-*-arm64.exe\` (installer) |
          | macOS Apple Silicon | \`flowlens-*-arm64.dmg\` |
          | macOS universal | the \`.dmg\` without an architecture in its name |
          | Linux x64 | \`.deb\` for Debian and Ubuntu, or \`flowlens-*-linux-amd64.tar.gz\` with \`install.sh\` |
          | Linux ARM64 | \`*_arm64.deb\` for Debian and Ubuntu, or \`flowlens-*-linux-arm64.tar.gz\` with \`install.sh\` |

          Every platform also has a \`flowlens-<version>-<target>.tar.gz\` archive and an \`update-<target>.json\` manifest for signed in-app updates, including Windows and macOS.

          Use \`SHA256SUMS\` to verify downloads.

          BODY
          gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "FlowLens ${TAG_NAME}" --notes-file "${RUNNER_TEMP}/release-body.md" --generate-notes

  verify:
    name: Verify (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # Keep verification caches separate from release build caches.
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
            .github/workflows/release.yml

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l main.go internal)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check UI lifecycle
        run: go tool mygo vet .

      - name: Check message catalogs
        run: go tool mygo i18n check

      - name: Run Go tests
        env:
          FLOWLENS_APPKIT_TEST: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: go test ./...

  build:
    name: Build (${{ matrix.name }})
    needs:
      - prepare
      - verify
    strategy:
      fail-fast: false
      # MyGo merges and replaces the release's shared SHA256SUMS on upload.
      max-parallel: 1
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/universal" }
          - { name: Windows, os: windows-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # MyGo downloads NSIS on Windows when it is not already installed.
      - name: Build and upload
        env:
          MYGO_LDFLAGS: "-macos=13.0"
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  check-assets:
    name: Check Release Assets
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every artifact reached the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > names.txt
          cat names.txt
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          awk '{print $2}' SHA256SUMS > checksum-names.txt
          for name in \
            "flowlens-setup-${VERSION}-amd64.exe" \
            "flowlens-setup-${VERSION}-arm64.exe" \
            "flowlens-${VERSION}-arm64.dmg" \
            "flowlens-${VERSION}.dmg" \
            "flowlens-${VERSION}-windows-amd64.tar.gz" \
            "flowlens-${VERSION}-windows-arm64.tar.gz" \
            "flowlens-${VERSION}-darwin-arm64.tar.gz" \
            "flowlens-${VERSION}-darwin-universal.tar.gz" \
            "flowlens-${VERSION}-linux-amd64.tar.gz" \
            "flowlens-${VERSION}-linux-arm64.tar.gz"; do
            if ! grep -Fxq "$name" names.txt; then
              echo "Missing release asset: $name" >&2
              exit 1
            fi
            if ! grep -Fxq "$name" checksum-names.txt; then
              echo "Missing release checksum: $name" >&2
              exit 1
            fi
          done
          # MyGo uploads update manifests separately and excludes them from SHA256SUMS.
          for target in windows-amd64 windows-arm64 darwin-arm64 darwin-universal linux-amd64 linux-arm64; do
            name="update-${target}.json"
            if ! grep -Fxq "$name" names.txt; then
              echo "Missing release asset: $name" >&2
              exit 1
            fi
          done
          # The version in a Debian package's name may be rewritten for prereleases.
          for arch in amd64 arm64; do
            if ! name="$(grep -E "^flowlens_.*_${arch}\.deb$" names.txt)"; then
              echo "Missing release asset: the ${arch} Debian package" >&2
              exit 1
            fi
            if ! grep -Fxq "$name" checksum-names.txt; then
              echo "Missing release checksum: $name" >&2
              exit 1
            fi
          done

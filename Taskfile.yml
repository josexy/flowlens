version: "3"

# Ordinary compilation uses Go bindings to platform APIs on every desktop OS.
env:
  CGO_ENABLED: '0'
  # MyGo supplies its own -ldflags, so GOFLAGS cannot set this build metadata.
  # The Go linker ignores -macos for non-Darwin executables.
  MYGO_LDFLAGS: '-macos=13.0 {{.MYGO_LDFLAGS}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  dev:
    desc: Runs the application with live reload
    cmds:
      - go tool mygo dev

  run:
    desc: Builds with MyGo and runs the application once
    vars:
      RUN_DIR: .mygo/run
      EXECUTABLE: '{{if eq OS "darwin"}}FlowLens.app/Contents/MacOS/FlowLens{{else if eq OS "windows"}}FlowLens.exe{{else}}flowlens{{end}}'
    cmds:
      - go tool mygo build -o "{{.RUN_DIR}}" -skip-installer -skip-dmg
      - '"./{{.RUN_DIR}}/{{OS}}-{{ARCH}}/{{.EXECUTABLE}}"'

  package:
    desc: Packages a production build for the current platform
    cmds:
      - go tool mygo build {{.CLI_ARGS}}

  icons:generate:
    desc: Exports application and tray icons from their SVG sources
    cmds:
      - go run ./assets/icons/generate.go

  test:
    desc: Runs all Go tests
    cmds:
      - go test ./...

  # Go 1.27's Darwin race detector works without cgo. Windows/Linux require
  # cgo and a supported C compiler for this optional check only.
  test:race:
    desc: Runs Go tests with the race detector, by default on the concurrency-heavy packages
    env:
      CGO_ENABLED: '{{if eq OS "darwin"}}0{{else}}1{{end}}'
    vars:
      PACKAGES: '{{.CLI_ARGS | default "./internal/desktop/... ./internal/pkg/process_attribution ./internal/services/proxy_service"}}'
    cmds:
      - go test -race {{.PACKAGES}}

  fmt:check:
    desc: Fails if any Go file needs formatting
    cmds:
      - test -z "$(gofmt -l main.go internal 2>/dev/null)"

  lint:go:
    desc: Checks Go code with golangci-lint
    cmds:
      - golangci-lint config verify
      - golangci-lint run ./...

  lint:go:fix:
    desc: Applies safe Go lint and formatting fixes
    cmds:
      - golangci-lint run --fix ./...

  modernize:
    desc: Analyzes Go code for modernization opportunities
    cmds:
      - go fix -diff ./...

  modernize:fix:
    desc: Applies Go modernization fixes
    cmds:
      - go fix ./...

  vet:ui:
    desc: Checks native UI lifecycle rules
    cmds:
      - go tool mygo vet .

  i18n:generate:
    desc: Generates the typed message package from the catalogs
    cmds:
      - go tool mygo generate

  i18n:check:
    desc: Checks the message catalogs
    cmds:
      - go tool mygo i18n check

  verify:
    desc: Runs formatting, lint, UI lifecycle, catalog, and test checks
    cmds:
      - task: fmt:check
      - task: lint:go
      - task: vet:ui
      - task: i18n:check
      - task: test
